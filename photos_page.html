    <div class="lightbox" id="lightbox">
<span class="lightbox-seta" id="lightbox-anterior">&#8249;</span>
        <img class="lightbox-img" id="lightbox-img" src="" alt="">
        <span class="lightbox-seta" id="lightbox-proximo">&#8250;</span>
    </div>

    <footer>
        <p class="rodape">© 2026 - Gustavo Lecce</p>
    </footer>
    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const anterior = document.getElementById('lightbox-anterior');
        const proximo = document.getElementById('lightbox-proximo');

        const fotos = Array.from(document.querySelectorAll('.galeria img'));
        let indiceAtual = 0;

        function abrirLightbox(indice) {
            indiceAtual = indice;
            lightboxImg.src = fotos[indiceAtual].src;
            lightboxImg.alt = fotos[indiceAtual].alt;
            lightbox.classList.add('ativo');
        }

        function fecharLightbox() {
            lightbox.classList.remove('ativo');
        }

        fotos.forEach((img, i) => {
            img.addEventListener('click', () => abrirLightbox(i));
        });

        anterior.addEventListener('click', (e) => {
            e.stopPropagation();
            abrirLightbox((indiceAtual - 1 + fotos.length) % fotos.length);
        });

        proximo.addEventListener('click', (e) => {
            e.stopPropagation();
            abrirLightbox((indiceAtual + 1) % fotos.length);
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) fecharLightbox();
        });

        let trocando = false;
        lightbox.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (trocando) return;
            if (e.deltaX > 30) {
                trocando = true;
                abrirLightbox((indiceAtual + 1) % fotos.length);
                setTimeout(() => trocando = false, 600);
            } else if (e.deltaX < -30) {
                trocando = true;
                abrirLightbox((indiceAtual - 1 + fotos.length) % fotos.length);
                setTimeout(() => trocando = false, 600);
            }
        }, { passive: false });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('ativo')) return;
            if (e.key === 'ArrowRight') abrirLightbox((indiceAtual + 1) % fotos.length);
            if (e.key === 'ArrowLeft') abrirLightbox((indiceAtual - 1 + fotos.length) % fotos.length);
            if (e.key === 'Escape') fecharLightbox();
        });
    </script>
</body>
</html>
